name: corplunch-login-qa
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corplunch
      POSTGRES_PASSWORD: local-qa-only
      POSTGRES_DB: corplunch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corplunch -d corplunch"]
      interval: 2s
      timeout: 5s
      retries: 20
  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://corplunch:local-qa-only@db:5432/corplunch
      JWT_SECRET: local-login-qa-only-not-for-deployment
      JWT_EXPIRE_MINUTES: "480"
      MEALTY_CITY: Москва
      CUTOFF_TIME: "16:00"
    entrypoint:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:18000:8000"
    networks:
      - default
      - browser
    depends_on:
      db:
        condition: service_healthy
networks:
  default:
    internal: true
  browser: {}
